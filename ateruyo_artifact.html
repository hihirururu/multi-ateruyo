<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>複数人アテルーヨー</title>
<style>
:root{
  --bg:#141a2b; --bg2:#1c2439; --bg3:#0e1322; --line:#2c3652; --ink:#eef1f8; --dim:#8f9abb;
  --paper:#f6f1e6; --ok:#2f9e5b; --warn:#d9a33a;
  --O:#d97757; --S:#3f9fb5;
  --c-y:#2f9e5b; --c-py:#8fcf9f; --c-m:#c9c4b6; --c-pn:#eaa59a; --c-n:#c8473f; --c-u:#8a84a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;font-size:15px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--bg2);border-radius:0;padding:.35em .8em}
button:hover{filter:brightness(1.2)}
button:disabled{opacity:.4;cursor:default;filter:none}
input{min-width:0}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
#main{flex:1;min-height:0;display:grid}
.hidden{display:none!important}


#setup{display:grid;grid-template-columns:clamp(280px,26vw,400px) minmax(0,1fr);min-height:0}
#compose{display:flex;flex-direction:column;min-height:0;background:var(--bg2);border-right:2px solid var(--O)}
#ed{flex:1;min-height:0;display:flex;overflow:hidden;font-size:1.35em;line-height:1.6}
#gut{flex:0 0 1.6em;background:var(--paper);color:var(--O);font-weight:800;text-align:center;padding:.3em 0;overflow:hidden}
#gut div{height:1.6em}
#names{flex:1;resize:none;border:0;outline:none;background:var(--paper);color:#1b2033;font:inherit;font-weight:700;line-height:1.6;padding:.3em .6em;white-space:pre;overflow:auto}
#names::placeholder{color:#b3a98f;font-weight:400}
#theme{border:0;border-bottom:1px solid var(--line);outline:none;background:#fff8e6;color:#1b2033;font-weight:800;font-size:1.2em;padding:.45em .6em}
#theme::placeholder{color:#9a9488;font-weight:400;font-size:.75em}
#smsg{background:#3a2228;color:#ffd6cf;font-size:.95em}
#smsg div{padding:.35em .8em;border-top:1px solid #5b3038}
#smsg:empty{display:none}
#cost{padding:.3em .6em;font-size:.78em;font-weight:700;line-height:1.35;color:#7a2e12;background:#fde3d4;border-bottom:1px solid var(--line)}
#sact{display:flex}
#sact button{font-weight:800;padding:.7em 1em}
#go{flex:1;background:var(--O);color:#fff;font-size:1.3em}
#genBtn{background:var(--bg3);color:var(--ink);font-size:1em;border-left:1px solid var(--line)}
#plist{min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(120,minmax(0,1fr));grid-auto-flow:row dense;grid-auto-rows:minmax(min-content,1fr);background:var(--line);gap:1px}
#plist button{display:flex;flex-direction:column;justify-content:flex-start;background:var(--paper);color:#1b2033;text-align:left;padding:.3em .6em;font-weight:800;font-size:1.15em;line-height:1.3;overflow-wrap:anywhere}
#plist button:hover{background:#fff3d6}
#plist i{font-style:normal;display:inline-block;max-width:100%}#plist .col i{display:block;white-space:nowrap}#plist .col .sp{display:none}#plist .sp{color:var(--O);font-weight:400;margin-left:.35em}#plist button.on .sp{color:#fff}
#plist button.on{background:var(--O);color:#fff}#plist button.on small{color:#ffe3d6}
#plist small{display:block;font-weight:400;font-size:.68em;color:#8a8170;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#game{min-height:0;display:grid;grid-template-columns:clamp(170px,19vw,280px) minmax(0,1fr) clamp(170px,19vw,280px)}
#tablewrap{overflow:auto;background:var(--paper);color:#222;min-height:0}
table{border-collapse:collapse;width:100%;table-layout:fixed}
thead th{position:sticky;top:0;z-index:2;background:#24304d;color:#fff;font-weight:700;padding:.25em .3em;border-right:1px solid #3a4768;text-align:center;vertical-align:middle}
thead th.q{text-align:left;padding-left:.7em;font-size:1em;font-weight:800;color:#fff}
thead th .lt{color:#ffd0bd;margin-right:.25em}
#log.mid thead th{padding:.2em .12em;vertical-align:bottom}#log.mid thead th .lt{display:block;font-size:.65em;margin:0}#log.mid thead th .nm{display:block;word-break:keep-all;overflow-wrap:normal;font-size:var(--nmf,13px);line-height:1.15}#log.mid thead th .bd{display:block;width:fit-content;margin:.15em auto 0}#log.mid thead th.q{vertical-align:top;padding:.3em .4em}#log.mid td.gs.x{text-decoration:line-through}#log.mid td.gs{font-size:var(--gsf,11px);padding:.15em .05em;word-break:keep-all;overflow-wrap:normal;line-height:1.15}
thead th .nm{font-size:.84em;line-height:1.2;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
.bd{display:inline-block;font-size:.72em;font-weight:800;padding:0 .35em;margin-left:.2em;color:#fff;vertical-align:.1em}
.bd.O{background:var(--O)}.bd.S{background:var(--S)}
.blur{filter:blur(6px);user-select:none}
col.no{width:2.6em}
tbody td{border-bottom:1px solid #d9cfb9;border-right:1px solid #d9cfb9;padding:0;vertical-align:middle}
tbody tr:nth-child(odd) td.q{background:#fbf8f1}
td.no{text-align:center;color:#fff;font-size:.8em;font-weight:800;font-variant-numeric:tabular-nums}
td.no.O{background:var(--O)}td.no.S{background:var(--S)}
td.q{padding:.1em .6em}
td.q .t{font-weight:700;color:#1b2033;font-size:1.1em;line-height:1.3}
td.q .s{font-size:.78em;color:#7a705c;margin-top:.05em}
td.ch{text-align:center;font-weight:900;font-size:var(--sym,20px);line-height:1.2;cursor:pointer;position:relative;padding:0}
#log.many td.gs{font-size:var(--sym,18px);font-weight:900;padding:0}
#log.many thead th{padding:.2em 0;font-size:var(--lt,15px)}
.y{color:#1f7a44}.py{color:#5a9c6c}.m{color:#9a917e}
.pn{color:#c0786c}.n{color:#b8372f}.u{color:#7d77a0}
td.ch.dim{background:#eee7d6!important;color:#b9ae94}
.fix::after{content:"✎";position:absolute;right:.2em;top:0;font-size:.75em}
tr.inv td.q .t{color:#9a917e;text-decoration:line-through}
tr.inv.pass td.q .t{text-decoration:none}
tr.inv td.inv{color:#9a917e;font-size:.85em;text-align:center}
tr.ans td:not(.no){background:#efe8d8!important}
tr.ans td.q .t{color:#b5562f}
tr td.gs{text-align:center;padding:.2em .25em;font-size:.82em;font-weight:700;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance;color:#1b2033}
tr td.gs.o{color:#1f7a44}
tr td.gs.x{color:#b8372f;opacity:.75}
tr td.gs.w{color:#a8761a}
tr.fut td{background:#ece4d1!important}
tr.fut td.no{opacity:.45}
tr.think td.q{background:#fff3c8!important}
tr.think td.q .t{color:#7a5a0a}
td.wrap{padding:.15em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.2em,1fr));gap:2px}
.it{display:flex;align-items:stretch;font-size:.78em;font-weight:700;min-height:1.9em;position:relative;cursor:pointer}
.it i{font-style:normal;color:#b5562f;min-width:1.5em;display:flex;align-items:center;justify-content:center}
.it span{flex:1;display:flex;align-items:center;justify-content:flex-start;padding:0 .2em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#1b2033}
.it.o span{color:#1f7a44}.it.x span{color:#b8372f;opacity:.75}.it.w span{color:#a8761a}
.it span.y{color:#1f7a44}.it span.py{color:#5a9c6c}.it span.m{color:#9a917e}.it span.pn{color:#c0786c}.it span.n{color:#b8372f}.it span.u{color:#7d77a0}
#tstrip{display:flex;flex-wrap:wrap;background:#24304d;position:sticky;top:0;z-index:2}
#tstrip div{flex:1 1 auto;padding:.15em .5em;color:#fff;font-size:.9em;font-weight:700;border-right:1px solid #3a4768;border-bottom:1px solid #3a4768;word-break:keep-all;overflow-wrap:anywhere}
#tstrip div b{color:#ffd0bd;margin-right:.3em}

.side{position:relative;background:linear-gradient(#232c48,#141a2b);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.side.O{border-right:1px solid var(--line)}.side.S{border-left:1px solid var(--line)}
.side .nmb{display:flex;align-items:center;gap:.5em;padding:.3em .6em;font-weight:900;font-size:1.05em;color:#fff}
.side.O .nmb{background:var(--O)}.side.S .nmb{background:var(--S)}
.side .nmb .cnt{margin-left:auto;font-size:.8em;font-weight:700;font-variant-numeric:tabular-nums}
.side .nmb .mdl{font-size:.68em;font-weight:500;opacity:.85}
.side.act .nmb{box-shadow:inset 0 -4px #fff8}
.side.act .nmb::after{content:"考え中";font-size:.65em;background:#0004;padding:0 .4em;font-weight:700;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.bubble{margin:.5em .5em 0;background:#fff;color:#1b2033;padding:.45em .65em;font-weight:700;font-size:.9em;position:relative;z-index:2;line-height:1.45}
.side.O .bubble{border:2px solid var(--O)}.side.S .bubble{border:2px solid var(--S)}
.bubble:empty{display:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.side.O .bubble::after{border-right:2px solid var(--O);border-bottom:2px solid var(--O)}
.side.S .bubble::after{border-right:2px solid var(--S);border-bottom:2px solid var(--S)}
.review{margin:.5em .5em 0;background:#fdfaf2;color:#1b2033;font-size:.84em;line-height:1.55;position:relative;z-index:2;max-height:66%;overflow:auto}
.side.O .review{border:2px solid var(--O)}.side.S .review{border:2px solid var(--S)}
.review .hd{display:flex;align-items:baseline;gap:.5em;color:#fff;padding:.2em .6em;font-weight:800;position:sticky;top:0}
.side.O .review .hd{background:var(--O)}.side.S .review .hd{background:var(--S)}
.review .hd .sc{margin-left:auto;font-size:1.25em}
.review .tx{padding:.35em .6em}
.review .kn{padding:0 .6em .35em;color:#8a5a2a;font-size:.92em}
.review .ar{padding:.3em .6em;border-top:1px dashed #d9cfb9;color:#5a4a8a;font-size:.92em}
.stand{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;margin-top:.3em}
.stand img{max-width:100%;max-height:100%;object-fit:contain;object-position:bottom}
.side.S .stand img{transform:scaleX(-1)}
.stand img.pop{animation:pop .35s ease-out}
@keyframes pop{0%{opacity:.4;translate:0 6px}100%{opacity:1;translate:0 0}}

#hud{display:flex;flex-wrap:wrap;align-items:center;gap:.25em .5em;text-align:left;font-weight:700}
#hud #title{font-size:1.05em;color:#fff;margin-right:auto}
#hud #res{font-weight:900}
#st{font-size:1em;color:#fff;font-weight:700}#st:empty{display:none}body.ingame #st{display:none}
#title small{font-size:.8em;color:#ffd0bd;margin-left:.6em}
#ctl{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px;margin-left:auto}
#adv{display:flex;flex:1 1 13em;min-width:9em}
#adv input{flex:1;border:0;outline:none;background:#fff8e6;color:#1b2033;font-weight:700;font-size:.9em;padding:.15em .5em}
#adv input::placeholder{color:#9a9488;font-weight:400}
#adv button{background:var(--O);color:#fff;font-size:.82em;font-weight:700;padding:.15em .7em;white-space:nowrap}
#ctl button{background:#3a4768;color:#fff;padding:.15em .7em;font-size:.82em;font-weight:700;white-space:nowrap}
#ctl button.main{background:var(--O);font-size:.95em}
#ctl button.main:disabled{background:#5a3a30;color:#d9c3b9;opacity:1}
#tstrip #hud{flex:1 1 100%;padding:.25em .5em;border-bottom:1px solid #3a4768}

#pop{position:fixed;z-index:10;background:#1c2439;border:1px solid var(--O);width:min(22em,92vw);box-shadow:0 6px 24px #0008}
#pop .f{padding:.5em .7em;font-size:.85em;color:#dfe3ef;border-bottom:1px solid var(--line)}
#pop .f b{color:#ffd0bd}
#pop .opts{display:grid;grid-template-columns:repeat(3,1fr)}
#pop .opts button{border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.85em;padding:.5em .2em}
#pop .opts button.cur{outline:2px solid var(--O);outline-offset:-2px}
#dbg{position:fixed;left:0;bottom:0;background:#a33;color:#fff;font-size:11px;padding:1px 6px;z-index:20}
#toast{position:fixed;left:50%;top:3em;transform:translateX(-50%);background:var(--O);color:#fff;padding:.4em 1em;font-weight:700;z-index:30}

@media (max-width:820px){
  body{font-size:14px}
  #setup{grid-template-columns:1fr}
  #setup{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  #compose{grid-row:1;border-right:0;border-bottom:2px solid var(--O)}
  #plist{grid-row:2}
  #game{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,9em) minmax(0,1fr)}
  #tablewrap{grid-column:1/3;grid-row:2}
  .side .stand{display:none}
  .review{max-height:none}
  #ctl{width:100%;order:6}
  #ctl button{flex:1;padding:.6em}
}
/* 立ち絵のない版（claude.ai に出す版）: 両者を表の上の段に左右に並べ、表は横いっぱい。段の高さは中身だけ */
body.noimg #game{grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr)}
body.noimg #tablewrap{grid-column:1/3;grid-row:2}
body.noimg .side{background:#fff;max-height:46vh;border:0}
body.noimg .side.O{border-right:2px solid #24304d}
body.noimg .stand{display:none}
body.noimg .bubble{margin:0;padding:.3em .7em;font-size:1em}
body.noimg .bubble::after{display:none}
body.noimg .review{margin:0;max-height:none;flex:1;min-height:0;font-size:.9em}
</style>
</head>
<body>
<div id="app">

  <main id="main">
    <section id="setup">
      <div id="compose">
        <div id="cost">Opus 対 Sonnet、審判も Opus なので、トークンの消費が激しいです。</div>
        <div id="sact"><button id="go">出題する</button><button id="genBtn">AIに作らせる</button></div>
        <input id="theme" spellcheck="false" placeholder="テーマを書くとAIがそのテーマで作る">
        <div id="smsg"></div>
        <div id="ed"><div id="gut"></div><textarea id="names" spellcheck="false" placeholder="右から選ぶか、1行に1つ書く&#10;&#10;宮本武蔵&#10;大谷翔平"></textarea></div>
      </div>
      <div id="plist"></div>
    </section>

    <section id="game" class="hidden">
      <div class="side O" id="sideO"><div class="nmb"><span>Opus</span><span class="mdl"></span><span class="cnt"></span></div><div class="bubble"></div><div class="review hidden"></div><div class="stand"><img alt=""></div></div>
      <div id="tablewrap"><div id="tstrip" class="hidden"></div><table id="log"></table></div>
      <div class="side S" id="sideS"><div class="nmb"><span>Sonnet</span><span class="mdl"></span><span class="cnt"></span></div><div class="bubble"></div><div class="review hidden"></div><div class="stand"><img alt=""></div></div>
    </section>

  </main>

  <!-- 問題文・状態・ボタン。対局中は表の見出しの問題文の欄に入れる（下のバーは作らない） -->
  <nav id="hud"><b id="title"></b><b id="res" class="hidden"></b><span id="st"></span><span id="ctl"></span><span id="adv"><input id="advText" maxlength="80" spellcheck="false" placeholder="OpusとSonnetにアドバイス"><button id="advBtn">送る</button></span></nav>
</div>
<div id="pop" class="hidden"></div>
<div id="dbg" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script>
"use strict";
const SUM = "2fdandgivp5";  // 写しちがいの点検。tools/build_artifact.py が、claude.ai に出す版にだけ値を入れる
const SELF = document.currentScript ? document.currentScript.textContent : "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 名前を2行に折るとき、「・」「＝」「（」の切れ目で、行の長さがそろうように折る
// 見出し・解答のマス用の略称（7〜14人の表）
// - 8字までの名前はそのまま。長い名前は姓（最後の部分）。「ダ・ヴィンチ」「ド・セシェル」のような前置きの語は姓に付けて残す。ジュニア・頭文字は外す
// - ふつう名前で呼ぶ人（ナポレオン）は名前。かっこの補足は残す（同じ名前の人と見分けるため）
const NAME_PARTICLE = /^(ダ|ド|デ|ディ|デル|デラ|ラ|ル|レ|フォン|ファン|ヴァン|ヴォン|オブ|アル|エル|ディ・)$/;
const CALL_BY_FIRST = /^(ナポレオン)$/;
const shortName = s => {
  const full = String(s).trim(), m = full.match(/^(.*?)\s*([（(].*[）)])\s*$/);
  const base = (m ? m[1] : full).trim(), paren = m ? m[2] : "";
  const seg = base.split(/[・＝=]/).filter(Boolean);
  let b = base;
  if (seg.length > 1 && [...base].length > 8) {
    const core = seg.filter(x => !/^(ジュニア|シニア|Jr\.?|[A-ZＡ-Ｚ]\.?)$/i.test(x));
    if (core.length && CALL_BY_FIRST.test(core[0])) b = core[0];
    else if (core.length) { const k = core.length - 1; b = k > 0 && NAME_PARTICLE.test(core[k - 1]) ? core[k - 1] + "・" + core[k] : core[k]; }
  }
  return b + paren;
};
// 表に並ぶ名前の略称。略称が重なったら、その名前は略さない
const shortMap = names => { const sh = names.map(shortName), M = new Map(); names.forEach((n, i) => M.set(n, sh.filter(x => x === sh[i]).length > 1 ? n : sh[i])); return M; };
// 2行に折る位置: 「・」「＝」の後か「（」の前で、真ん中にいちばん近い所。無ければ真ん中（「ー」や小さい字が行の頭に来ない所）
const breakAt = s => {
  const a = [...s]; if (a.length <= 3) return -1;
  const mid = a.length / 2; let best = -1;
  a.forEach((c, i) => { const h = /[・＝]/.test(c) ? i + 1 : c === "（" || c === "(" ? i : -1; if (h > 0 && h < a.length && (best < 0 || Math.abs(h - mid) < Math.abs(best - mid))) best = h; });
  if (best > 0) return best;
  const small = i => /[ーァィゥェォッャュョヮヵヶぁぃぅぇぉっゃゅょ]/.test(a[i]);
  let h = Math.ceil(mid); while (h > 1 && small(h)) h--; if (small(h)) { h = Math.ceil(mid); while (h < a.length - 1 && small(h)) h++; }
  return h;
};
// lineLen は2行に折ったときの長いほうの行の字数（文字の大きさを決めるのに使う）
const lineLen = s => { const a = [...s], h = breakAt(s); return h < 0 ? a.length : Math.max(h, a.length - h); };
// 幅が足りないときだけ折れるようにしておく
const twoLine = s => { const a = [...s], h = breakAt(s); return h < 0 ? esc(s) : esc(a.slice(0, h).join("")) + "<wbr>" + esc(a.slice(h).join("")); };
const nmWrap = s => esc(s).replace(/([・＝])/g, "$1<wbr>").replace(/（/g, "<wbr>（");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LT = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const MAXN = 60, WIDE = 6, NAMED = 14;  // 7個以上は名前を略して見出しに出す。15個以上は見出しを記号だけにし、名前は表の上の帯
const CHOICES = ["はい", "どちらかというとはい", "どちらでもない", "どちらかというといいえ", "いいえ", "わからない"];
const CH = { "はい": ["y", "はい"], "どちらかというとはい": ["py", "ややはい"], "どちらでもない": ["m", "どちらでも"], "どちらかというといいえ": ["pn", "ややいいえ"], "いいえ": ["n", "いいえ"], "わからない": ["u", "不明"] };
const EMO = { "はい": "🟩", "どちらかというとはい": "🟢", "どちらでもない": "⬜", "どちらかというといいえ": "🟠", "いいえ": "🟥", "わからない": "⬛" };
const EXPECTS = ["はい", "いいえ", "割れる", "不明", "正解済み"];
const CONFS = ["low", "mid", "high"];
const TIER_LABEL = { quick: "Haiku級", default: "標準モデル", complex: "Opus級" };
// 対戦は Opus 対 Sonnet で固定。審判は Opus。
const P = {

const MOCK_Q = ["日本の人ですか？", "1800年以降に生きていましたか？", "政治家ですか？", "軍人ですか？", "1945年以降に生きていましたか？", "1〜6月生まれですか？", "名前の読みは五十音で『た』より前ですか？", "ノーベル賞を受賞しましたか？", "大河ドラマの主人公になりましたか？", "享年60以上ですか？", "作家ですか？", "科学者ですか？"];
function mockAI(p) {
  const n = (p.match(/^ターゲット[A-Z]{1,2}: /gm) || []).length || +((p.match(/の名前(\d+)個/) || [])[1] || 0) || (p.match(/^[A-Z]{1,2}: /gm) || []).length || 3;
  const r = a => a[Math.floor(Math.random() * a.length)];
  if (p.startsWith("【受付】")) {
    const ins = [...p.matchAll(/ターゲット[A-Z]{1,2}: 「(.*)」/g)].map(m => m[1]);
    return JSON.stringify({ question: `この${ins.length}人の偉人、だ～れだ？`, targets: ins.map(s => ({ ok: true, name: s, aliases: [], desc: "（モック）確認ずみ", issue: "" })) });
  }
  if (p.startsWith("【回答係】")) return JSON.stringify(Math.random() < .06 ? { valid: false, reason: "（モック）無効の見本" }
    : { valid: true, facts: Array.from({ length: n }, (_, i) => `${L(i)}の事実（モック）`), answers: Array.from({ length: n }, () => r(CHOICES)) });
  if (p.startsWith("【判定係】")) {
    const names = [...p.matchAll(/^([A-Z]{1,2}): 「(.*)」$/gm)].map(m => m[2]);
    const right = [...p.matchAll(/^([A-Z]{1,2}): (.*?)（別名/gm)].map(m => m[2]);
    return JSON.stringify({ match: names.map(x => { const j = right.indexOf(x); return j < 0 ? "-" : L(j); }) });
  }
  if (p.startsWith("【感想戦】")) return JSON.stringify({ knew: Array(n).fill(true), hyoka: "（モック）よい問題でした", kansou: "（モック）序盤の時代の質問で主役が決まり、1人目の○からテーマが見えました。審判の答えも安定していました。", memo: { used: [], add: ["（モック）1800年以降？の次は政治家？"], drop: [], fix: [] }, advice_reply: "（モック）取り入れました。" });
  if (p.startsWith("【出題係】")) return JSON.stringify({ theme: "初代", question: "この5人の偉人、だ～れだ？", names: ["神武天皇", "源頼朝", "足利尊氏", "徳川家康", "伊藤博文"], notes: ["初代天皇", "鎌倉幕府初代将軍", "室町幕府初代将軍", "江戸幕府初代将軍", "初代内閣総理大臣"] });
  const asked = (p.match(/^\S+の質問\d+ /gm) || []).length;
  const final = p.includes("最後の解答だけ");
  const opus = p.includes("プレイヤー「Opus」");
  if (final || (asked >= 5 && Math.random() < .3)) {
    const names = (window.__mockTargets || []).map(x => Math.random() < .5 ? x : "坂本龍馬");
    return JSON.stringify({ action: "answer", names, theme: "モックのテーマ", conf: "high", say: opus ? "これは確定したかもしれません。答えます。" : "よし、ここは賭けてみよう。" });
  }
  const q = MOCK_Q.find(x => !p.includes(`「${x}」`)) || `享年${50 + asked}以上ですか？`;
  return JSON.stringify({ action: "question", question: q, expect: Array.from({ length: n }, () => r(["はい", "いいえ", "割れる"])), conf: r(CONFS),
    say: opus ? "定石どおり、時代から聞いていきます。Aは例えば徳川家康か伊達政宗あたりでしょうか。" : "まずはここを分けたいな。Bは信長か秀吉あたりかなあ。" });
}

// ===================================================================== 出題画面
const S = { busy: false, ids: null, question: "", checkedFor: "" };
const MAXQ = 15;  // 質問は1人15問
const resText = h => h.winner ? `${P[h.winner].name} ${h.q}問` : "出題者の勝ち";
const names = () => $("names").value.split(/\r?\n/).map(x => x.replace(/^[\s•・\-*]+/, "").trim()).filter(Boolean).slice(0, MAXN);

// 名前を全部選んでコピーすると、テーマの行も付ける。テーマの行がある文を貼ると、テーマの欄に戻す

const VCOL = 14;  // この人数までは1人1行で縦に並べる
// 人数の多いお題を上に（同じ段に同じくらいの人数が並び、マスの空きが減る）
$("plist").innerHTML = PRESETS.map((p, i) => [p, i]).sort((x, y) => y[0].targets.length - x[0].targets.length || x[1] - y[1]).map(([p, i]) => `<button data-i="${i}"${p.targets.length <= VCOL ? ' class="col"' : ""}><small>${esc(p.theme)}（${p.targets.length}）</small><span>${p.targets.map((x, k) => `<i>${esc(x)}${k < p.targets.length - 1 ? '<b class="sp">／</b>' : ""}</i>`).join(" ")}</span></button>`).join("");
function fitList() {  // 列は1マスが名前の読める幅（文字22個ぶん以上）になる数。収まらなければスクロール、空きが出るときだけ文字を大きくして埋める
  const el = $("plist"), bs = [...el.querySelectorAll("button")]; if (!bs.length) return;
  const n = bs.length;
  el.style.fontSize = ""; el.style.gridAutoRows = "min-content"; bs.forEach(b => { b.style.gridColumn = ""; b.style.gridRow = ""; });
  const base = parseFloat(getComputedStyle(bs[0]).fontSize);
  let pc = Math.max(1, Math.min(6, Math.floor(el.clientWidth / (base * 15))));
  const wide = () => bs.some(b => b.scrollWidth > b.clientWidth + 1);  // 縦に並べた名前がマスの幅からはみ出す
  // 60列の格子に置く（1〜6で割り切れる）。マスの足りない段は、その段のマスで横幅を分け合う（空きマスを作らない）
  // どの段も同じ数・同じ幅のマスで並べる。人数がとても多いお題だけ横いっぱい、縦に長いお題（10人以上を1人1行）は2段ぶんの高さ
  const big = () => bs.map(b => pc > 1 && !b.classList.contains("col") && PRESETS[+b.dataset.i].targets.join("・").length > el.clientWidth / pc / base * 4.5);
  const tall = b => b.classList.contains("col") && PRESETS[+b.dataset.i].targets.length >= 10;
  const place = () => {
    const bg = big();
    bs.forEach((b, i) => { b.style.gridColumn = bg[i] ? "1 / -1" : `span ${120 / pc}`; b.style.gridRow = pc > 1 && !bg[i] && tall(b) ? "span 2" : ""; });
  };
  // 列の数は、最後の段に空きマスが出ない数を選ぶ（なければ空きのいちばん少ない数）
  const pick = mx => {
    let best = mx, bestGap = 1e9;
    for (let c = mx; c >= Math.max(1, mx - 2); c--) {
      pc = c; const bg = big(), cells = bs.reduce((a, b, i) => a + (bg[i] ? 0 : c > 1 && tall(b) ? 2 : 1), 0), gap = (c - cells % c) % c;
      if (gap < bestGap) { best = c; bestGap = gap; }
    }
    pc = best;
  };
  pick(pc); place();
  while (pc > 1 && wide()) { pick(pc - 1); place(); }
  const top = el.getBoundingClientRect().top, used = () => Math.max(...bs.map(b => b.getBoundingClientRect().bottom)) - top + el.scrollTop;
  let k = 1;
  for (let t = 0; t < 40 && used() < el.clientHeight && !wide() && k < 2.2; t++) { k *= 1.03; el.style.fontSize = (k * 100) + "%"; }
  if (wide() && k > 1) { k /= 1.03; el.style.fontSize = (k * 100) + "%"; }
  for (let t = 0; t < 40 && used() > el.clientHeight && k > 1; t++) { k /= 1.015; el.style.fontSize = (k * 100) + "%"; }
  el.style.gridAutoRows = used() <= el.clientHeight ? "" : "min-content";
}
addEventListener("resize", fitList); requestAnimationFrame(fitList);
$("plist").onclick = e => {

async function go() {
  if (S.busy) return;  // Ctrl+Enter の連打などで二重に走らせない
  const ns = names();
  if (ns.length < 2) { drawSetup(["2つ以上、1行に1つずつ書いてください"]); return; }
  const key = ns.join("\n");
  if (S.ids && S.checkedFor === key) { startGame(ns); return; }  // 決められない名前があっても、そのまま出す
  S.busy = "check"; drawSetup();
  try {
    const d = await askJSON(receptionPrompt(ns), d =>
      Array.isArray(d.targets) && d.targets.length === ns.length && d.targets.every(t => t && typeof t.ok === "boolean") ? "" : `targets は${ns.length}個`);
    if (names().join(String.fromCharCode(10)) !== key) { S.busy = false; drawSetup(["確かめている間に名前が変わったので、もう一度「出題する」を押してください"]); return; }  // 古いお題で始めない
    S.ids = d.targets.map((t, i) => ({ ok: t.ok, name: String(t.name || "").trim() || ns[i], aliases: Array.isArray(t.aliases) ? t.aliases.map(String).slice(0, 10) : [], desc: String(t.desc || "").slice(0, 40), issue: String(t.issue || "").slice(0, 60) }));
    S.question = String(d.question || "").slice(0, 40); S.checkedFor = key;
    S.busy = false;
    const bad = S.ids.map((t, i) => t.ok ? "" : `${L(i)}「${ns[i]}」: ${t.issue || "何を指すか決められません"}`).filter(Boolean);
    if (!bad.length) { startGame(ns); return; }
    drawSetup([...bad, "かっこで補足を足して直すか、このまま出題できます"]);
  } catch (e) { S.busy = false; drawSetup(["審判に届きませんでした: " + e.message]); }
}
async function gen() {
  if (S.busy) return;
  S.busy = "gen"; drawSetup();
  try {
    const avoid = [...new Set(history.map(h => h.theme).filter(Boolean))].slice(0, 20);
    const d = await askJSON(genPrompt(avoid, $("theme").value.trim()), d => d.theme && Array.isArray(d.names) && d.names.length >= 2 ? "" : "theme と names が要る");
    $("names").value = d.names.map(String).slice(0, MAXN).join("\n");

}

// ===================================================================== 対局
let G = null;
function startGame(ns) {
  const T = ns.map((s, i) => {
    const d = S.ids && S.ids[i];
    return d && d.ok ? { input: s, name: d.name, aliases: [s, ...d.aliases], desc: d.desc } : { input: s, name: s, aliases: [s], desc: "" };
  });
  const max = +new URLSearchParams(location.search).get("max") || MAXQ;
  G = { prompt: S.question || `この${T.length}つ、な～んだ？`, theme: $("theme").value.trim(), max, n: T.length, T, ev: [],
    final: { O: false, S: false }, done: { O: false, S: false }, turn: Math.random() < .5 ? "O" : "S",
    ended: false, stop: false, paused: false, invRun: { O: 0, S: 0 }, winner: null, advice: [], conf: { O: "mid", S: "mid" }, say: { O: "", S: "" }, review: {} };
  window.__mockTargets = T.map(t => t.name);
  show("game");
  ["O", "S"].forEach(p => { side(p, ".review").classList.add("hidden"); setStand(p, "mid"); showSay(p, ""); });
  drawTop(); drawTable(); run();
}
const side = (p, sel) => $("side" + p).querySelector(sel);

const norm = s => String(s || "").normalize("NFKC").replace(/[\s・･＝=\-‐（）()「」『』、。,.]/g, "").toLowerCase();  // 長音「ー」は残す（ミラとミラーは別の名前）
// 解答の採点。marks: 枠ごとの o（正解）／w（別の枠の正解）／x、to: その名前が正解になる枠（-1 はどれでもない）
async function judgeGuess(names) {
  const g = G, marks = names.map(() => null), to = names.map(() => -1);
  g.seen = g.seen || {};  // この対局で審判が一度決めた名前 → 枠（-1 はどれとも違う）。両者の採点で使い回す
  // 正解の名前か登録した別名が、ちょうど1つの枠にだけ合うときだけ自動で決める。2つ以上の枠に合う名前は審判に聞く（使い回しもしない）
  const hits = x => g.T.map((t, j) => [t.name, ...t.aliases].some(a => norm(a) && norm(a) === norm(x)) ? j : -1).filter(j => j >= 0);
  const pend = [];
  names.forEach((x, i) => {
    const h = hits(x), key = norm(x);
    const j = h.length === 1 ? h[0] : !h.length && key && key in g.seen ? g.seen[key] : null;
    if (j === null) { pend.push(i); return; }
    to[i] = j; marks[i] = j === i ? "o" : j >= 0 ? "w" : "x";
  });
  if (pend.length) {  // 決まらなかった名前だけを審判に聞く
    const d = await askJSON(judgePrompt(g, pend.map(i => [i, names[i]])), d => Array.isArray(d.match) && d.match.length === pend.length ? "" : `match は${pend.length}個`);
    pend.forEach((i, k) => {
      const m = LI(d.match[k]), j = m >= 0 && m < g.n ? m : -1;
      to[i] = j; marks[i] = j === i ? "o" : j >= 0 ? "w" : "x";
      if (!hits(names[i]).length && norm(names[i])) g.seen[norm(names[i])] = j;
    });
  }
  return { marks, to };
}

// 無効の質問を表に残す。無効が3回続いたら1問ぶん使う（審判の無効も、差し戻し3回も同じ数え方）
function invalid(g, p, text, reason, say) {
  g.ev.push({ p, kind: "inv", text, reason, say });
  if (++g.invRun[p] >= 3) { g.ev.push({ p, kind: "q", no: qCount(g, p) + 1, text: "（無効が3回続いたので1問ぶん使った）", answers: Array(g.n).fill("わからない"), facts: [], say: "", over: {} }); g.invRun[p] = 0; }
}
const shortReason = e => { const t = String(e).split(/[。（]/)[0]; return t.length > 30 ? t.slice(0, 29) + "…" : t; };
async function run() {
  const g = G;
  try {
    while (!g.ended) {
      while (g.paused && !g.stop) await sleep(200);
      if (g.stop) return;
      const p = g.turn;
      if (g.done[p]) { g.turn = other(p); continue; }
      busy(`${P[p].name}が考えています`, p);
      try {
      let d = null, note = "";
      for (let t = 0; t < 3; t++) {
        d = await askJSON(guesserPrompt(g, p, note), checkGuess(g, p), p);
        const err = precheck(g, p, d);
        if (!err) break;
        if (t === 2) { d = { bad: err, action: d.action, question: d.question, say: d.say }; break; }
        note = `※あなたの前の案（${d.action === "question" ? "「" + d.question + "」" : "解答"}）は出せません: ${err}。別の手を選んでください。`;
      }
      if (g.stop) return;
      if (d.bad) {  // 3回とも出せない手だった。審判には送らず、理由を表に残して相手の手番にする
        if (d.action === "question") {
          invalid(g, p, String(d.question).trim(), shortReason(d.bad), String(d.say || "").slice(0, 120));
          if (qCount(g, p) >= g.max) g.final[p] = true;
        } else g.ev.push({ p, kind: "inv", text: "（続けて解答しようとした）", reason: "質問をはさんでいない", say: "" });
        g.turn = other(p); drawTop(); drawTable(); continue;
      }
      const say = String(d.say || "").slice(0, 120);
      g.conf[p] = CONFS.includes(d.conf) ? d.conf : g.conf[p];
      setStand(p, g.conf[p]); showSay(p, say);
      if (d.action === "question") {
        const q = String(d.question).trim();
        g.thinking = { p, q, say }; drawTable();
        busy("審判が答えています", p);
        const o = await askJSON(oraclePrompt(g, q), checkOracle(g));
        if (g.stop) return;
        g.thinking = null;
        if (o.valid === false) {
          invalid(g, p, q, String(o.reason || "無効").slice(0, 20), say);
        } else {
          g.invRun[p] = 0;
          g.ev.push({ p, kind: "q", no: qCount(g, p) + 1, text: q, answers: o.answers, facts: o.facts.map(x => String(x).slice(0, 90)), expect: d.expect, say, over: {} });
        }
        if (qCount(g, p) >= g.max) g.final[p] = true;
      } else {
        const names = d.names.map(x => String(x).trim().slice(0, 40));
        g.thinking = { p, guess: names, say }; drawTable();
        busy("審判が判定しています", p);
        const { marks, to } = await judgeGuess(names);
        if (g.stop) return;
        g.thinking = null;
        g.ev.push({ p, kind: "a", names, marks, to, say, theme: String(d.theme || "").slice(0, 30) });
        if (solvedSet(g, p).size === g.n) { await end(p); return; }
        if (g.final[p]) g.done[p] = true;
        if (g.done.O && g.done.S) { await end(null); return; }
      }
      } catch (e) {
        // AIに届かなかった手番（止められた・送らなかった）は、送り直さずにパスにする。1局で2回あったら、その対局はやめる
        if (!e.blocked || g.stop) throw e;
        g.thinking = null; g.blocks = (g.blocks || 0) + 1;
        g.ev.push({ p, kind: "inv", pass: true, text: "パス", reason: "AIに届かなかった", say: "" });
        showSay(p, ""); toast(`${P[p].name}の手番はパス：${e.message}`);
        if (g.blocks >= 2) { await end(null, e.message); return; }
        if (g.final[p]) g.done[p] = true;
        if (g.done.O && g.done.S) { await end(null); return; }
      }
      g.turn = other(p);
      drawTop(); drawTable();
    }
  } catch (e) {
    if (g.stop) return;
    g.thinking = null; drawTable();
    idle(); $("st").textContent = "AIに届きませんでした: " + String(e.message || e).slice(0, 80);
    $("ctl").innerHTML = `<button class="main" id="retry">続ける</button><button id="quit">やめる</button>`;
  }
}

async function end(winner, abort = "") {
  const g = G;
  g.ended = true; g.winner = winner;
  const qn = winner ? qCount(g, winner) : 0;
  g.result = abort ? "中止" : winner ? `${P[winner].name}の勝ち` : "出題者の勝ち";
  ["O", "S"].forEach(p => { setStand(p, winner === p ? "high" : "low"); showSay(p, ""); });
  if (abort) { g.reviewing = false; drawEnd(); $("st").textContent = abort; return; }  // 中止した対局は戦績に入れず、感想戦もしない（これ以上AIに送らない）
  const usedAdv = advices.slice();
  const rec = { date: new Date().toISOString(), theme: g.theme, prompt: g.prompt, targets: g.T.map(t => t.input), names: g.T.map(t => t.name), winner, q: qn, qO: qCount(g, "O"), qS: qCount(g, "S"), max: g.max };
  history = [rec, ...history].slice(0, 300); store.set("history", history);
  console.info("GAME " + JSON.stringify({ T: g.T, ev: g.ev, result: g.result }));
  g.reviewing = true;
  drawEnd();
  busy("感想戦を書いています", null);
  $("ctl").innerHTML = "";
  await Promise.all(["O", "S"].map(async p => {
    try {
      const r = await askJSON(reviewPrompt(g, p), checkReview(g), p);
      g.review[p] = r;
      rec["hyoka" + p] = r.hyoka;
      rec.unknown = [...new Set([...(rec.unknown || []), ...g.T.filter((t, i) => r.knew[i] === false).map(t => t.name)])];
      if (!MOCK) { applyMemo(p, r.memo); store.set("lessons" + p, lessons[p]); }
    } catch (e) { g.review[p] = { error: String(e.message || e) }; }
    if (G === g) drawReview(p);
  }));
  g.reviewing = false;
  store.set("history", history);
  if (!MOCK) { advices = advices.filter(a => !usedAdv.includes(a)); store.set("advices", advices); }  // 感想戦の間に届いた分は次の対局へ
  console.info("REVIEW_DONE");
  if (G === g) drawEnd();
}

// ===================================================================== 描画
let tick = null, tickStart = 0, tickLabel = "";
function busy(label, p) {
  tickLabel = label; tickStart = Date.now();
  const f = () => { $("st").textContent = `${tickLabel}… ${Math.floor((Date.now() - tickStart) / 1000)}秒`; };
  f(); clearInterval(tick); tick = setInterval(f, 500);
  ["O", "S"].forEach(k => $("side" + k).classList.toggle("act", k === p));
  if (G && !G.ended) {
    $("res").classList.add("hidden");
    $("ctl").innerHTML = `<button id="pause">${G.paused ? "再開" : "一時停止"}</button><button id="quit">やめる</button>`;
  }
}
function idle() { clearInterval(tick); ["O", "S"].forEach(k => $("side" + k).classList.remove("act")); }
function mask(s) {
  if (!G || !hideNames || G.ended) return s;
  let t = String(s);
  G.T.forEach(x => [x.name, ...x.aliases].filter(a => a && a.length >= 2).sort((a, b) => b.length - a.length).forEach(a => { t = t.split(a).join("●●"); }));
  return t;
}
const endMark = s => { s = String(s || "").trim(); return !s || /[。？！?!…」』）)]$/.test(s) ? s : s + "。"; };
function showSay(p, s) {
  s = endMark(s); G.say[p] = s;
  side(p, ".bubble").textContent = mask(s);
}
function setStand(p, conf) {
  const img = side(p, ".stand img"), src = STAND[`${P[p].img}_${conf}`] || STAND[`${P[p].img}_mid`];
  if (!src) return;
  if (img.getAttribute("src") !== src) { img.src = src; img.classList.remove("pop"); void img.offsetWidth; img.classList.add("pop"); }
}

function show(t) {
  $("setup").classList.toggle("hidden", t !== "setup");
  $("game").classList.toggle("hidden", t !== "game");
  if (t !== "game") { const h = $("hud"); h.classList.add("hidden"); document.body.append(h); }
  if (t === "setup") drawSetup();
  drawTop();
}
function drawTop() {
  const inGame = !!G;
  document.body.classList.toggle("ingame", inGame && !G.ended);
  $("title").innerHTML = !inGame ? "" : G.ended && G.theme ? `テーマ：${esc(G.theme)}` : esc(G.prompt) + (G.theme ? `<small>テーマ：${esc(G.theme)}</small>` : "");
  if (!inGame) return;
  ["O", "S"].forEach(p => {
    side(p, ".cnt").textContent = `質問 ${qCount(G, p)}/${G.max}`;
    side(p, ".mdl").textContent = applied[p] && applied[p] !== P[p].label ? applied[p] : "";
  });
}

// 答えの記号（はい ○・ややはい 緑△・どちらでも －・ややいいえ 赤△・いいえ ×・わからない ？）
const SYM = { "はい": "○", "どちらかというとはい": "△", "どちらでもない": "－", "どちらかというといいえ": "△", "いいえ": "×", "わからない": "？" };
let advIME = false, drawWait = false;  // アドバイスを日本語入力で打っている間は、表の描き直しを待つ（入力欄が見出しの中にあるため）
function drawTable() {
  if (!G) return;
  if (advIME) { drawWait = true; return; }
  const at = $("advText"), foc = document.activeElement === at, sel = foc ? [at.selectionStart, at.selectionEnd] : null;
  const hud = $("hud"); hud.remove(); hud.classList.remove("hidden");  // 見出しを描き直す前に外しておく
  // どの人数でも、ターゲットごとに1列。人数が多いときは見出しを記号（A・B…）だけにし、名前は表の上の帯に出す
  const kO = solvedSet(G, "O"), kS = solvedSet(G, "S"), blur = hideNames && !G.ended ? "blur" : "", named = G.n <= NAMED, sh = G.n > WIDE, SM = shortMap(G.T.map(t => t.name)), snm = s => SM.get(s) || shortName(s), nmT = s => sh ? twoLine(snm(s)) : nmWrap(s);
  const badges = i => (kO.has(i) ? `<span class="bd O">O</span>` : "") + (kS.has(i) ? `<span class="bd S">S</span>` : "");
  const nm = t => `<span class="nm ${blur}" title="${esc(t.name)}">${nmT(t.name)}</span>`;
  $("tstrip").classList.toggle("hidden", named);
  if (!named) $("tstrip").innerHTML = G.T.map((t, i) => `<div><b>${L(i)}</b>${nm(t)}${badges(i)}</div>`).join("");
  $("log").classList.toggle("many", !named); $("log").classList.toggle("mid", named && sh);
  const cols = `<colgroup><col class="no"><col style="width:${G.n <= 3 ? 42 : G.n <= 4 ? 34 : G.n <= WIDE ? 28 : G.n <= NAMED ? 24 : G.n <= 20 ? 30 : 22}%">${G.T.map(() => "<col>").join("")}</colgroup>`;
  const head = `<thead><tr><th></th><th class="q"></th>${G.T.map((t, i) => `<th><span class="lt">${L(i)}</span>${named ? nm(t) + badges(i) : ""}</th>`).join("")}</tr></thead>`;
  const cellA = (e, i) => {
    const a = effAns(e)[i], c = (CH[a] || ["m"])[0], fix = e.over && e.over[i] ? " fix" : "";
    return `<td class="ch ${c}${fix}" data-e="${G.ev.indexOf(e)}" data-i="${i}" title="${esc(a)}">${SYM[a] || esc(a)}</td>`;
  };
  const cellG = (e, n, i) => {
    const m = e.marks ? e.marks[i] : "", mk = m === "o" ? "○" : m === "w" ? "↔" : m === "x" ? "×" : "";
    return named ? `<td class="gs ${m}" title="${esc(n)}">${sh ? "" : mk}${nmT(n)}</td>` : `<td class="gs ${m}" title="${esc(n)}">${mk || "・"}</td>`;
  };
  const row = (cls, p, no, text, cells) => `<tr class="${cls}"><td class="no ${p}">${no}</td><td class="q"><div class="t">${text}</div></td>${cells.join("")}</tr>`;
  const rows = []; let seq = 0;
  G.ev.forEach(e => {
    if (e.kind === "q") rows.push(row("", e.p, ++seq, esc(e.text), G.T.map((_, i) => cellA(e, i))));
    else if (e.kind === "inv") rows.push(`<tr class="inv${e.pass ? " pass" : ""}"><td class="no ${e.p}"></td><td class="q"><div class="t">${esc(e.text)}</div></td><td class="inv" colspan="${G.n}">${e.pass ? "" : "無効"}（${esc(e.reason)}）</td></tr>`);
    else if (e.kind === "a") rows.push(row("ans", e.p, ++seq, `解答${e.theme ? `　<small>${esc(mask(e.theme))}</small>` : ""}`, e.names.map((n, i) => cellG(e, n, i))));
  });
  if (G.thinking) {
    const t = G.thinking;
    rows.push(t.q ? row("think", t.p, seq + 1, esc(t.q), G.T.map(() => `<td class="ch m dim">…</td>`))
      : row("think ans", t.p, seq + 1, "解答", t.guess.map((n, i) => cellG({}, n, i))));
  }
  rows.reverse();  // 新しい質問を上に
  $("log").innerHTML = cols + head + `<tbody>${rows.join("")}</tbody>`;
  if (named) $("log").querySelector("th.q").replaceChildren(hud); else $("tstrip").prepend(hud);
  // 記号と見出しの記号（A・B…）は、1列の幅に収まる大きさにする
  const cw = $("log").querySelector("thead th:nth-child(3)").offsetWidth;
  $("log").style.setProperty("--sym", Math.min(20, cw * .78) + "px");
  $("log").style.setProperty("--lt", Math.min(15, cw * (G.n > 26 ? .42 : .7)) + "px");
  // 名前（略称）は、いちばん長い行が列の幅に収まる大きさにする
  const longest = arr => Math.max(2, ...arr.map(x => lineLen(snm(x))));
  $("log").style.setProperty("--nmf", Math.min(16, cw / (longest(G.T.map(t => t.name)) + .4)) + "px");
  $("log").style.setProperty("--gsf", Math.min(14, cw / (longest(G.ev.filter(e => e.kind === "a").flatMap(e => e.names)) + .4)) + "px");
  $("tablewrap").scrollTop = 0;
  if (foc) { at.focus(); at.setSelectionRange(sel[0], sel[1]); }
}

function drawReview(p) {
  const r = G.review[p], rv = side(p, ".review");
  if (!r) { rv.classList.add("hidden"); return; }
  rv.classList.remove("hidden"); side(p, ".bubble").textContent = "";
  rv.innerHTML = r.error ? `<div class="tx">感想戦を書けませんでした（${esc(r.error)}）</div>`
    : `<div class="hd">${esc(r.hyoka)}</div><div class="tx">${esc(endMark(r.kansou))}</div>`
      + (r.knew.some(x => x === false) ? `<div class="kn">知らなかった：${esc(G.T.filter((t, i) => r.knew[i] === false).map(t => t.name).join("、"))}</div>` : "")
      + (r.advice_reply ? `<div class="ar">アドバイスへの返事：${esc(r.advice_reply)}</div>` : "");
}
function drawEnd() {
  const g = G;
  if (!g.reviewing) idle();
  const th = ["O", "S"].map(p => { const a = [...evOf(g, p)].reverse().find(e => e.kind === "a"); return a && a.theme ? `${P[p].name}の見立て：${a.theme}` : ""; }).filter(Boolean);
  if (!g.reviewing) $("st").textContent = th.join("　");
  $("res").classList.remove("hidden");
  $("res").textContent = g.result + (g.winner ? `（質問${qCount(g, g.winner)}）` : "");
  $("res").style.color = g.winner ? `var(--${g.winner})` : "#9fe0b3";
  $("ctl").innerHTML = g.reviewing ? "" : `<button id="share">結果をコピー</button><button id="again">もう一度</button><button class="main" id="new">新しいお題</button>`;
  ["O", "S"].forEach(drawReview);
  drawTop(); drawTable();
}

function shareText() {
  const R = [`複数人アテルーヨー「${G.prompt}」`, G.result + (G.winner ? `（質問${qCount(G, G.winner)}）` : "")];
  G.ev.forEach(e => {
    if (e.kind === "q") R.push(`${P[e.p].name[0]} ` + effAns(e).map(a => EMO[a] || "⬜").join("") + " " + e.text);
    else if (e.kind === "a") R.push(`${P[e.p].name[0]} ` + e.marks.map(m => m === "o" ? "⭕" : m === "w" ? "🔁" : "❌").join("") + " 解答");
  });
  R.push(`答え：${G.T.map(t => t.name).join("・")}${G.theme ? `（${G.theme}）` : ""}`);
  return R.join("\n");
}
async function copy(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) {}
  try { const t = document.createElement("textarea"); t.value = s; document.body.appendChild(t); t.select(); const ok = document.execCommand("copy"); t.remove(); return ok; } catch (e) { return false; }
}
function toast(s) { const t = $("toast"); t.textContent = s; t.classList.remove("hidden"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.add("hidden"), 2200); }

$("log").addEventListener("click", e => {
  const c = e.target.closest("[data-e]"); if (!c || (hideNames && !G.ended)) return;
  const ev = G.ev[+c.dataset.e], i = +c.dataset.i;
  const cur = effAns(ev)[i];
  const p = $("pop");
  p.innerHTML = `<div class="f"><b>${L(i)} ${esc(G.T[i].name)}</b><br>${esc((ev.facts || [])[i] || "")}</div><div class="opts">${CHOICES.map(x => `<button data-v="${esc(x)}" class="${x === cur ? "cur" : ""}">${esc(CH[x][1])}</button>`).join("")}</div>`;
  p.classList.remove("hidden");
  const r = c.getBoundingClientRect();
  p.style.left = Math.max(4, Math.min(innerWidth - p.offsetWidth - 4, r.left + r.width / 2 - p.offsetWidth / 2)) + "px";
  p.style.top = (r.bottom + p.offsetHeight + 4 < innerHeight ? r.bottom + 2 : Math.max(4, r.top - p.offsetHeight - 2)) + "px";
  p._t = { ev, i };
  e.stopPropagation();
});
$("pop").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  const { ev, i } = $("pop")._t;
  ev.over = ev.over || {};
  if (b.dataset.v === ev.answers[i]) delete ev.over[i]; else ev.over[i] = b.dataset.v;
  $("pop").classList.add("hidden"); drawTable();
  e.stopPropagation();
});
document.addEventListener("click", e => { if (!e.target.closest("#pop")) $("pop").classList.add("hidden"); });


$("ctl").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "pause") { G.paused = !G.paused; b.textContent = G.paused ? "再開" : "一時停止"; if (G.paused) tickLabel = "一時停止中（いまの手が終わったら止まります）"; }
  else if (b.id === "quit") { if (G) G.stop = true; backToSetup(); }
  else if (b.id === "retry") run();
  else if (b.id === "share") toast(await copy(shareText()) ? "コピーしました" : "コピーできませんでした");
  else if (b.id === "again") startGame(G.T.map(t => t.input));
  else if (b.id === "new") backToSetup();
});
// AIへのアドバイス。対局中は次の手番から両者が読み、感想戦で攻略メモに取り入れるかを決める。
// 対局が終わった後に送った分は、次の対局で読む。
function sendAdvice() {
  const t = $("advText").value.replace(/\s+/g, " ").trim().slice(0, 80); if (!t || !G) return;
  if (G.ended) { advices.push({ text: t, at: Date.now() }); store.set("advices", advices); toast("次の対局で両者が読みます"); }
  else { G.advice.push(t); toast("次の手番から両者が読みます"); }
  $("advText").value = "";
}
$("advBtn").onclick = sendAdvice;
$("advText").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) sendAdvice(); });
$("advText").addEventListener("compositionstart", () => { advIME = true; });
$("advText").addEventListener("compositionend", () => { advIME = false; if (drawWait) { drawWait = false; drawTable(); } });
$("advText").addEventListener("blur", () => { advIME = false; if (drawWait) { drawWait = false; drawTable(); } });
function backToSetup() { idle(); G = null; show("setup"); $("names").focus(); }

// ===================================================================== 開始
(async () => {
  let lO, lS;
  [history, lO, lS, advices, hideNames] = await Promise.all([
    store.get("history", []), store.get("lessonsO", []), store.get("lessonsS", []), store.get("advices", []), false]);
  lessons = { O: (lO || []).map(normLesson), S: (lS || []).map(normLesson) };
  if (!(await store.get("memoSeed", 0))) {  // 初期の攻略メモを一度だけ入れる（前からのメモは後ろに残す）
    for (const k of ["O", "S"]) {
      const have = new Set(lessons[k].map(x => x.t));
      lessons[k] = [...BASE_MEMO.filter(t => !have.has(t)).map(t => ({ t, n: 0, age: 0, base: true })), ...lessons[k]].slice(0, MAX_LESSONS);
      store.set("lessons" + k, lessons[k]);
    }
    store.set("memoSeed", 1);
  }
  if ((await store.get("memoSeed", 0)) < 2) {  // 職業を全部調べさせるメモを外す
    const bad = new Set(["答えがばらけるのに職業が全部いいえなら、名前の字や音のつながり、架空の人物・人以外のものを疑う", "大きな職業が全部いいえの枠には「実在の人物ですか？」。架空なら作品名・作者の線で絞る"]);
    for (const k of ["O", "S"]) { lessons[k] = lessons[k].filter(x => !bad.has(x.t)); store.set("lessons" + k, lessons[k]); }
    store.set("memoSeed", 2);
  }
  if ((await store.get("memoSeed", 0)) < 3) {  // 基本の攻略法を作り直したので、攻略メモを初期の項目から始め直す（2026-11-21。前のメモは lessonsO_old・lessonsS_old に残す）
    for (const k of ["O", "S"]) {
      if (lessons[k].length) store.set("lessons" + k + "_old", lessons[k]);
      lessons[k] = BASE_MEMO.map(t => ({ t, n: 0, age: 0, base: true }));
      store.set("lessons" + k, lessons[k]);
    }
    store.set("memoSeed", 3);
  }
  if ((await store.get("memoSeed", 0)) < 4) {  // 基本の攻略法と同じことを言う初期の項目を外す（AIが足した項目は残す）
    const dup = new Set(["相手が○を取った名前は次の解答にそのまま書く。相手の○の人からテーマを考えるのがいちばん速い", "主役が2択まで絞れたら質問を使わず本命で解答する。×でも1人消え、○ならテーマの手がかりになる", "質問の前に枠ごとの答えを予想し、半々に割れそうな枠が2つ以上ある質問を選ぶ。全枠同じ予想なら聞かない", "2人当たったら、2人の名前の字・読み・あだ名・最期・代名詞の物・記録を全部並べ、重なるものをテーマ候補にする", "5人以上で答えがそろうなら、名前のついた組か「歴代」「全員」の一覧。人数と時代から組を言い当てる", "同じ答えが並ぶ枠のかたまりは1つの組。大きなくくりで半分に割って何者かを突き止め、1人分かれば並び称される人で残りを埋める", "奇数と偶数・何個おきなど、答えが規則正しく並ぶなら小さな組のくり返し。1組が分かれば残りの組も同じ作り"]);
    for (const k of ["O", "S"]) { lessons[k] = lessons[k].filter(x => !dup.has(x.t)); store.set("lessons" + k, lessons[k]); }
    store.set("memoSeed", 4);
  }
  show("setup"); $("names").focus();
  const q = new URLSearchParams(location.search);
  const dm = q.get("demo") || q.get("live");
  if (dm) {  // 画面確認用: ?demo=1（モック）／?live=1（手元のサーバーで本物）。?demo=p3 はお題の例の4番目
    const D = { 1: [["宮本武蔵", "大谷翔平"], "二刀流"], 2: [["織田信長", "豊臣秀吉", "徳川家康"], "三英傑"], 3: [["夏目漱石", "ベートーヴェン", "藤原道長"], "月"] };
    const p = D[dm] ? { targets: D[dm][0], theme: D[dm][1] } : PRESETS[+dm.replace("p", "")] || PRESETS[0];
    $("names").value = p.targets.join("\n"); $("theme").value = p.theme || "";
    await go(); if (!G) go();
  }
})();
</script>
